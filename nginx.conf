# ersetzt conf.d/default.conf von nginx-unprivileged

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_tokens off;
    client_max_body_size 1k;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css;

    # Seite und Code werden bei jedem Laden per ETag revalidiert, damit ein Deploy sofort sichtbar ist
    add_header Cache-Control "no-cache" always;
    # Schriften selbst gehostet (assets/fonts), Inline-Styles für Segmentfarben (style="--k:…"), Favicon als data:-URI
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
